name: RobotcupMini snapshot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-integrity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check snapshot, URDF, and bound demonstration hashes
        run: python -m tools.repro.verify_snapshot
      - name: Check expert feature construction (no simulator or policy training)
        run: |
          python -m pip install numpy==1.26.0
          python -m tools.amp.motion_loader
      - name: Reject checkpoint and credential files from Git
        run: |
          python - <<'PY'
          import pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, files):
              p = pathlib.PurePosixPath(name)
              assert p.suffix.lower() not in {'.pt', '.pth', '.ckpt', '.onnx', '.pem', '.key'}, name
              assert not any(x in p.parts for x in ('logs', 'backups', 'artifacts', 'lilin')), name
              assert not p.name.startswith('.env'), name
          PY
